<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Ecliptica BGM Player v1.3</title><style>body{background:#151922;color:#eef;font:16px sans-serif;padding:24px}button{padding:12px;border:0;border-radius:8px;margin:7px;background:#526be2;color:white;cursor:pointer}#status{padding:14px;background:#252b3b;border-radius:8px;white-space:pre-wrap}#players{position:absolute;left:-9999px;top:-9999px;width:320px;height:200px}</style></head><body><h2>🎵 Ecliptica BGM Player v1.3</h2><p>このウィンドウを開いたままにしてください。最初に「再生を有効化」を押してください。</p><button onclick="unlock()">▶ 再生を有効化</button><button onclick="stopAll()">■ 停止</button><p id="status">待機中</p><div id="players"><div id="yt0"></div><div id="yt1"></div></div><script src="https://www.youtube.com/iframe_api"></script><script>
const aud=[new Audio(),new Audio()],yt=[null,null];
let active=0,seq=0,unlocked=false,ready=false,pending=null,last=-1,lastVolSeq=-1,master=0.8,currentGain=[0,0],currentTask=null,fadeFrame=0;
const statusEl=document.getElementById('status');
function status(msg){statusEl.textContent=msg;fetch('/player-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:msg})}).catch(()=>{});}
function setGain(i,g){currentGain[i]=Math.max(0,Math.min(1,g));const v=currentGain[i]*master;aud[i].volume=v;if(yt[i]&&typeof yt[i].setVolume==='function')try{yt[i].setVolume(Math.round(v*100))}catch(e){}}
function setMaster(v){master=Math.max(0,Math.min(1,Number(v)||0));for(let i=0;i<2;i++)setGain(i,currentGain[i]);}
function stop(i){aud[i].pause();aud[i].removeAttribute('src');aud[i].load();if(yt[i]&&yt[i].stopVideo)try{yt[i].stopVideo()}catch(e){}setGain(i,0);}
function stopAll(){pending=null;currentTask=null;seq++;cancelAnimationFrame(fadeFrame);stop(0);stop(1);status('停止中');}
function vid(url){try{const u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.slice(1);if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2]}}catch(e){}return null;}
function onYouTubeIframeAPIReady(){ready=true;for(let i=0;i<2;i++){yt[i]=new YT.Player('yt'+i,{height:'200',width:'320',videoId:'',playerVars:{playsinline:1,controls:0,origin:location.origin},events:{onReady:()=>{if(pending&&unlocked)runPending()},onError:e=>handleYoutubeError(i,e.data)}})}status('YouTubeプレイヤー準備完了・再生許可待ち');}
function handleYoutubeError(i,code){if(!currentTask||currentTask.slot!==i)return;const msg=code===150||code===101?'この動画は埋め込み再生が禁止されています（エラー'+code+'）':'YouTube再生エラー '+code;const t=currentTask;if(t.fallback){status(msg+'\n予備MP3に切り替えます');requestPlay(t.fallback,t.fade,t.vol,'');}else{status(msg+'\n予備MP3が未設定です');stop(i);}}
function requestPlay(track,fade,vol,fallback=''){pending={track,fade:Number(fade)||0,vol:Number(vol)||0,fallback};runPending();}
async function runPending(){if(!pending)return;if(!unlocked){status('再生待ち: 「▶ 再生を有効化」を押してください');return;}const task=pending,id=vid(task.track),i=1-active,old=active;if(id&&(!ready||!yt[i]||typeof yt[i].loadVideoById!=='function')){status('YouTube初期化待ち');return;}pending=null;const ticket=++seq;cancelAnimationFrame(fadeFrame);stop(i);currentTask={...task,slot:i};try{if(id){yt[i].loadVideoById(id);setGain(i,0);}else{aud[i].src='/media?path='+encodeURIComponent(task.track);aud[i].loop=true;aud[i].onerror=()=>{if(ticket===seq)status('音楽ファイルを読み込めませんでした');};await aud[i].play();}}catch(e){if(ticket===seq)status('再生失敗: '+e.message);return;}if(ticket!==seq)return;active=i;setMaster(task.vol);status('再生中: '+task.track);const initialOld=currentGain[old],start=performance.now(),duration=Math.max(0,task.fade)*1000;function step(now){if(ticket!==seq)return;const t=duration?Math.min(1,(now-start)/duration):1;setGain(i,t);setGain(old,(1-t)*initialOld);if(t<1)fadeFrame=requestAnimationFrame(step);else stop(old);}fadeFrame=requestAnimationFrame(step);}
function unlock(){unlocked=true;status('再生を有効化しました');if(pending)runPending();}
async function poll(){try{const r=await fetch('/state',{cache:'no-store'}),x=await r.json();if(x.volume_seq!==lastVolSeq){lastVolSeq=x.volume_seq;setMaster(x.volume);}if(x.seq!==last){last=x.seq;if(x.stop)stopAll();else if(x.track)requestPlay(x.track,x.fade,x.volume,x.fallback||'');}}catch(e){status('アプリとの通信に失敗: '+e.message);}if(pending&&unlocked)runPending();setTimeout(poll,500);}
status('アプリに接続しました');poll();
</script></body></html>
