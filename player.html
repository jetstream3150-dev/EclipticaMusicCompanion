<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Ecliptica BGM Player</title>
<style>
body{background:#151922;color:#eef;font:16px sans-serif;padding:24px}
button{padding:12px;border:0;border-radius:8px;margin:7px;background:#526be2;color:white;cursor:pointer}
#status{padding:14px;background:#252b3b;border-radius:8px;white-space:pre-wrap}
#players{display:flex;gap:8px;flex-wrap:wrap}#players iframe{width:220px;height:200px}
</style></head><body>
<h2>🎵 Ecliptica BGM Player</h2>
<p>このウィンドウを開いたままにしてください。最初に「再生を有効化」を押してください。</p>
<button onclick="unlock()">▶ 再生を有効化</button><button onclick="stopAll()">■ 停止</button>
<p id="status">待機中</p><div id="players"><div id="yt0"></div><div id="yt1"></div></div>
<script src="/engine.js"></script><script src="https://www.youtube.com/iframe_api"></script>
</body></html>
