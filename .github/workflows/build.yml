name: Investigate build 34 executable provenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect_official_bootloader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the official pinned Windows PyInstaller wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64 --python-version 3.14 --implementation cp --abi cp314 'pyinstaller==6.22.3' --dest "$RUNNER_TEMP/wheelhouse"

      - name: Compare executable code sections with build 34
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import struct
          import zipfile

          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'wheelhouse').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected exactly one pinned PyInstaller wheel')
          wheel = wheels[0]
          print('Wheel:', wheel.name)
          print('Wheel SHA-256:', hashlib.sha256(wheel.read_bytes()).hexdigest())
          with zipfile.ZipFile(wheel) as archive:
              matches = [p for p in archive.namelist() if p.endswith('/Windows-64bit-intel/runw.exe')]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one Windows x64 windowed bootloader')
              boot = archive.read(matches[0])
          print('Bootloader path:', matches[0])
          print('Bootloader SHA-256:', hashlib.sha256(boot).hexdigest())
          pe = struct.unpack_from('<I', boot, 0x3c)[0]
          if boot[pe:pe+4] != b'PE\x00\x00':
              raise RuntimeError('Invalid Windows executable header')
          machine, count, timestamp, _, _, optional_size, _ = struct.unpack_from('<HHIIIHH', boot, pe+4)
          if machine != 0x8664 or struct.unpack_from('<H', boot, pe+24)[0] != 0x20b:
              raise RuntimeError('Expected Windows x64 PE32+ executable')
          base = pe + 24 + optional_size
          sections = {}
          section_data = {}
          section_locations = {}
          for i in range(count):
              offset = base + i * 40
              name = boot[offset:offset+8].split(b'\0', 1)[0].decode('ascii', 'strict')
              vsize, rva, size, start = struct.unpack_from('<IIII', boot, offset+8)
              section_data[name] = boot[start:start+size]
              section_locations[name] = (vsize, rva, size, start)
              sections[name] = hashlib.sha256(section_data[name]).hexdigest()
          debug_rva, debug_size = struct.unpack_from('<II', boot, pe+24+112+6*8)
          _, rva, size, start = section_locations['.rdata']
          if debug_size != 28 or not (rva <= debug_rva and debug_rva + debug_size <= rva + size):
              raise RuntimeError('Unexpected debug directory location or size')
          debug_timestamp = struct.unpack_from('<I', boot, start+debug_rva-rva+4)[0]
          if debug_timestamp != 0x6aa5c4d8:
              raise RuntimeError('Unexpected official bootloader debug timestamp')
          print('Official PE timestamp:', hex(timestamp))
          print('Official debug timestamp:', hex(debug_timestamp))
          print('Build 34 PE and debug timestamp: 0x6ae0c699')
          print('Only the build 34 debug timestamp was normalized to the official timestamp before hashing.')
          print('The hashes below were independently calculated from the saved build 34 EXE.')
          expected = {
              '.text': '67bdc7f5eeccf01180cd5b3621be7d0265efa6a44742496a7a6c6f9076ef4b1f',
              '.rdata': '93dcce008db472c9c8cd4bf8a465c560d76bd0216e7fb5874a1866ae808a35ab',
          }
          for name, digest in expected.items():
              print(name, 'official:', sections.get(name, 'missing'), 'build 34 (normalized):', digest)
          if any(sections.get(name) != digest for name, digest in expected.items()):
              raise RuntimeError('Bootloader section differs from build 34; investigate before drawing conclusions')
          print('PASS: build 34 .text and timestamp-normalized .rdata match the pinned PyInstaller bootloader.')
          print('LIMITATION: this does not independently validate embedded application code or prove safety.')
          PY

  compare_application_bytecode:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out the exact build 34 source commit
        uses: actions/checkout@v5
        with:
          ref: 5b7876c82bdf7612963c1eb3022bf49cc5d98e29
          persist-credentials: false

      - name: Set up the same Python version as build 34
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'

      - name: Compare independently compiled application code with build 34
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import marshal
          from pathlib import Path
          import sys
          import types

          if sys.version_info[:3] != (3, 14, 10):
              raise RuntimeError('Unexpected Python version')

          # PyInstaller 6.22.3 recursively replaces co_filename in code objects
          # before writing both its CArchive scripts and PYZ modules.
          def anonymize(code, name):
              constants = tuple(
                  anonymize(value, name) if isinstance(value, types.CodeType) else value
                  for value in code.co_consts
              )
              return code.replace(co_consts=constants, co_filename=name)

          # Hashes were independently extracted without running the build 34 EXE.
          expected = {
              'EclipticaMusic': '730afed7d2540cbc9c4172957c1022fdc54d620925718f64822eecb27f2266ff',
              'combat_meter': '5e51e6f28bdebeeb9a2e5d827a42a8f7ea8927f0cb9700395147ca542a54c569',
              'vrchat_identity': 'a8e10bcf20569ce6ea54c8ca5ff33ed243125f90d36dcc8495f0206e3227df05',
              'boss_weakness': 'e107a1d5367a4fa552eee73e891e8472a257ddce392dc4fb04ad2f14db810774',
              'alert_sound': '125e88d4df1e51b74260d2eac427ed01620e0a9fec96404e0fddad8bb66714a5',
          }
          mismatch = []
          for module, digest in expected.items():
              filename = module + '.py'
              source = Path(filename).read_bytes()
              code = compile(source, str(Path(filename).resolve()), 'exec', optimize=0)
              code = anonymize(code, filename)
              actual = hashlib.sha256(marshal.dumps(code)).hexdigest()
              print(module, 'compiled:', actual, 'build 34:', digest)
              if actual != digest:
                  mismatch.append(module)
          if mismatch:
              raise RuntimeError('Bytecode hashes differ; investigate compilation settings: ' + ', '.join(mismatch))
          print('PASS: five application modules match the independently compiled sources.')
          print('LIMITATION: this does not validate third-party binaries or prove the distribution is safe.')
          PY
