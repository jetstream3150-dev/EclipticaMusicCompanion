name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.14.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'

      - name: Set up Node.js 24 for WebSocket tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r relay/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit installed direct dependencies
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit -r relay/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Python sources and lite feature gates
        shell: pwsh
        run: |
          python -m compileall -q EclipticaMusic.py combat_meter.py vrchat_identity.py boss_weakness.py alert_sound.py tools relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_v18.py --gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_lite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # tools/test_identity.py must run as a module for imports to resolve.
          python -m tools.test_identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_weakness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_combat_real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_watch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_package_release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_alert_sound
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_party_relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_party_hud
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_tcl_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check party.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_party_client.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows folder with Tcl Tk runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Current Windows Tcl/Tk 9 embeds its libraries in the DLLs via zipfs.
          # Older Python installations expose ordinary Tcl and Tk directories.
          $tclDir = (& python -c "import tkinter as tk; print(tk.Tcl().eval('info library'))").Trim()
          $pyiArgs = @(
            '-m', 'PyInstaller', '--noconfirm', '--clean', '--onedir', '--windowed',
            '--noupx', '--name', 'EclipticaMusicCompanion',
            '--exclude-module', 'yt_dlp', '--exclude-module', 'imageio_ffmpeg',
            '--add-data', 'player.html;.', '--add-data', 'unified.html;.',
            '--add-data', 'engine.js;.',
            '--add-data', 'party.js;.',
            '--add-data', 'boss_weakness_data.txt;.',
            '--add-data', 'LICENSE_EclipticaHUD-C.txt;.'
          )
          if ($tclDir.StartsWith('//zipfs:/')) {
            # PyInstaller 6.22's tkinter hook collects the Tcl/Tk DLLs; the
            # library scripts live inside those DLLs, not in filesystem paths.
            Write-Host "Tcl/Tk embedded library: $tclDir"
          } else {
            $tkVersion = (& python -c "import tkinter as tk; print(tk.TkVersion)").Trim()
            $tkDir = Join-Path (Split-Path -Parent $tclDir) ("tk" + $tkVersion)
            if (-not (Test-Path (Join-Path $tclDir 'init.tcl'))) { throw "Cannot find Tcl init.tcl in $tclDir" }
            if (-not (Test-Path (Join-Path $tkDir 'tk.tcl'))) { throw "Cannot find Tk tk.tcl in $tkDir" }
            $pyiArgs += @('--add-data', ($tclDir + ';_tcl_data'), '--add-data', ($tkDir + ';_tk_data'))
          }
          $pyiArgs += 'EclipticaMusic.py'
          & python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller exited with $LASTEXITCODE" }

      - name: Validate bundled Tcl Tk and run actual EXE smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/EclipticaMusicCompanion'
          $assets = @(
            '_internal/_tkinter.pyd',
            '_internal/python314.dll'
          )
          foreach ($asset in $assets) {
            $path = Join-Path $root $asset
            if (-not (Test-Path $path)) { throw "Missing Tcl/Tk runtime asset: $path" }
          }
          $tcl9 = (Get-ChildItem (Join-Path $root '_internal') -Filter 'tcl9*.dll' |
            Where-Object { $_.Name -notlike 'tcl9tk*' } | Select-Object -First 1)
          $tk9 = Get-ChildItem (Join-Path $root '_internal') -Filter 'tcl9tk*.dll' | Select-Object -First 1
          if (-not ($tcl9 -and $tk9)) {
            foreach ($asset in @('_internal/_tcl_data/init.tcl', '_internal/_tk_data/tk.tcl',
                                 '_internal/tcl86t.dll', '_internal/tk86t.dll')) {
              if (-not (Test-Path (Join-Path $root $asset))) { throw "Missing Tcl/Tk runtime asset: $asset" }
            }
          }
          # A headless option in EclipticaMusic.py initializes Tcl in the frozen EXE.
          # It does not start the browser, the HUD, or the background server.
          $env:ECLIPTICA_TK_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'ecliptica-tk-test-error.txt'
          $exe = (Resolve-Path (Join-Path $root 'EclipticaMusicCompanion.exe')).Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--tk-self-test' -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            if (Test-Path $env:ECLIPTICA_TK_SELF_TEST_REPORT) { Get-Content $env:ECLIPTICA_TK_SELF_TEST_REPORT }
            throw "Frozen Tcl/Tk startup smoke test failed: exit code $($probe.ExitCode)"
          }
          Write-Host 'PASS: bundled Tcl/Tk libraries and frozen executable startup'

      - name: Open the frozen app and HUD in an isolated GUI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ecliptica-gui-test'
          $env:ECLIPTICA_GUI_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'ecliptica-gui-test-error.txt'
          $exe = (Resolve-Path 'dist/EclipticaMusicCompanion/EclipticaMusicCompanion.exe').Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--gui-self-test' -PassThru
          if (-not $probe.WaitForExit(30000)) {
            $probe.Kill()
            throw 'Frozen GUI startup test timed out.'
          }
          if ($probe.ExitCode -ne 0) {
            if (Test-Path $env:ECLIPTICA_GUI_SELF_TEST_REPORT) {
              Get-Content $env:ECLIPTICA_GUI_SELF_TEST_REPORT
            }
            throw "Frozen GUI startup test failed: exit code $($probe.ExitCode)"
          }
          Write-Host 'PASS: frozen application and HUD initialized with boss data'

      - name: Verify release contents and write SHA256 manifest
        run: python tools/verify_release.py dist/EclipticaMusicCompanion

      - name: Microsoft Defender scan of the application folder
        shell: pwsh
        run: ./tools/windows_defender_scan.ps1 -ReleaseDir dist/EclipticaMusicCompanion

      - name: Create and verify the exact ZIP in temporary storage
        shell: pwsh
        run: |
          python tools/package_release.py dist/EclipticaMusicCompanion (Join-Path $env:RUNNER_TEMP 'EclipticaMusicCompanion-Windows.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Microsoft Defender scan of the ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'EclipticaMusicCompanion-Windows.zip')).Path
          $status = Get-MpComputerStatus -ErrorAction Stop
          $prefs = Get-MpPreference -ErrorAction Stop
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled -or
              -not $status.AntivirusSignatureLastUpdated -or
              $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)) {
            throw 'Defender is unavailable, disabled, or has stale signatures.'
          }
          if ($null -eq $prefs.DisableArchiveScanning -or $prefs.DisableArchiveScanning) {
            throw 'Defender archive scanning is disabled or could not be verified.'
          }
          foreach ($extension in @($prefs.ExclusionExtension)) {
            if (-not $extension) { continue }
            if (($extension -as [string]).TrimStart('.').ToLowerInvariant() -in @('zip','exe','pyd','dll','html','js')) {
              throw 'A distribution file extension is excluded from Defender scanning.'
            }
          }
          foreach ($exclusion in @($prefs.ExclusionPath)) {
            if (-not $exclusion) { continue }
            $expanded = [Environment]::ExpandEnvironmentVariables($exclusion).TrimEnd('\')
            if ($zip -like $expanded -or $zip -like ($expanded + '\*')) {
              throw 'The ZIP is under a Defender path exclusion.'
            }
          }
          $before = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $started = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath $zip -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-FileHash -Algorithm SHA256 $zip).Hash -ne $before) {
            throw 'The ZIP was removed or changed during the Defender scan.'
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $started.AddMinutes(-1) -and
            (@($_.Resources) -join ' ') -like "*$zip*"
          })
          if ($detections.Count -gt 0) { throw "Defender reported $($detections.Count) ZIP detection(s)." }
          Write-Host "PASS: Defender ZIP scan, signature $($status.AntivirusSignatureVersion), SHA-256 $before"
          Write-Host 'NOT CLEARED: Chrome warning remains under investigation; no file is uploaded.'

      # This repository is public. Keep all binaries on the temporary runner
      # until the Chrome warning and the distribution checks are resolved.
