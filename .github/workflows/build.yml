name: Check sample playback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'
      - name: Check official sample videos
        shell: pwsh
        run: |
          python -m tools.check_youtube_candidates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
