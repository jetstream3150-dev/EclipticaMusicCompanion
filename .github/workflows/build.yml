name: Security investigation of Windows build 34

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scan_existing_artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Retrieve the exact blocked ZIP and verify its digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/jetstream3150-dev/EclipticaMusicCompanion/actions/artifacts/12746474629/zip > "$RUNNER_TEMP/build34.zip"
          echo "14f62b44a1d1b523568d6e9e2e1a472d271471d05c1481cf17f3ad8c3cc041d5  $RUNNER_TEMP/build34.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/build34"
          unzip -q "$RUNNER_TEMP/build34.zip" -d "$RUNNER_TEMP/build34"
          echo 'Artifact digest matches the build 34 ZIP.'

      - name: Install ClamAV and update malware signatures
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout
          clamscan --version

      - name: Check scanner with the harmless EICAR test file
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'eicar-test.com'
          p.write_bytes(rb'X5O!P%@AP[4\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*')
          PY
          set +e
          clamscan --no-summary "$RUNNER_TEMP/eicar-test.com"
          result=$?
          set -e
          rm -f "$RUNNER_TEMP/eicar-test.com"
          if [ "$result" -ne 1 ]; then
            echo 'Scanner self-test failed or did not detect the harmless test file.' >&2
            exit 1
          fi
          echo 'Scanner detected the harmless EICAR test file.'

      - name: Scan the exact ZIP and extracted files
        shell: bash
        run: |
          set -euo pipefail
          clamscan --recursive --infected --alert-exceeds-max=yes --max-filesize=100M --max-scansize=300M --max-files=100000 --max-recursion=32 "$RUNNER_TEMP/build34.zip" "$RUNNER_TEMP/build34"
