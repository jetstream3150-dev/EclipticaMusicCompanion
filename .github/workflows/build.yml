
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EclipticaMusicCompanion --add-data "player.html;." EclipticaMusic.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: EclipticaMusicCompanion-Windows
          path: dist/EclipticaMusicCompanion.exe
          if-no-files-found: error
