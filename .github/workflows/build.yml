name: Investigate build 34 executable provenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect_official_bootloader:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the official pinned Windows PyInstaller wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          python -m pip download --only-binary=:all: --no-deps --platform win_amd64 --python-version 3.14 --implementation cp --abi cp314 'pyinstaller==6.22.3' --dest "$RUNNER_TEMP/wheelhouse"

      - name: Compare executable code sections with build 34
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import struct
          import zipfile

          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'wheelhouse').glob('*.whl'))
          if len(wheels) != 1:
              raise RuntimeError('Expected exactly one pinned PyInstaller wheel')
          wheel = wheels[0]
          print('Wheel:', wheel.name)
          print('Wheel SHA-256:', hashlib.sha256(wheel.read_bytes()).hexdigest())
          with zipfile.ZipFile(wheel) as archive:
              matches = [p for p in archive.namelist() if p.endswith('/Windows-64bit-intel/runw.exe')]
              if len(matches) != 1:
                  raise RuntimeError('Expected exactly one Windows x64 windowed bootloader')
              boot = archive.read(matches[0])
          print('Bootloader path:', matches[0])
          print('Bootloader SHA-256:', hashlib.sha256(boot).hexdigest())
          pe = struct.unpack_from('<I', boot, 0x3c)[0]
          if boot[pe:pe+4] != b'PE\x00\x00':
              raise RuntimeError('Invalid Windows executable header')
          machine, count, _, _, _, optional_size, _ = struct.unpack_from('<HHIIIHH', boot, pe+4)
          if machine != 0x8664:
              raise RuntimeError('Expected Windows x64 executable')
          base = pe + 24 + optional_size
          sections = {}
          section_data = {}
          for i in range(count):
              offset = base + i * 40
              name = boot[offset:offset+8].split(b'\0', 1)[0].decode('ascii', 'strict')
              _, _, size, start = struct.unpack_from('<IIII', boot, offset+8)
              section_data[name] = boot[start:start+size]
              sections[name] = hashlib.sha256(section_data[name]).hexdigest()
          expected = {
              '.text': '67bdc7f5eeccf01180cd5b3621be7d0265efa6a44742496a7a6c6f9076ef4b1f',
              '.rdata': '62f52c84f30e63a93cc3624bd5ed51324ca86a3291611734d79e74aff0b2f1b4',
          }
          for name, digest in expected.items():
              print(name, 'official:', sections.get(name, 'missing'), 'build 34:', digest)
          # Publish only hashes of the official bootloader's small blocks, so
          # the different region can be found without uploading the test ZIP.
          data = section_data.get('.rdata', b'')
          print('OFFICIAL_RDATA_SIZE', len(data))
          for offset in range(0, len(data), 1024):
              print('OFFICIAL_RDATA_BLOCK', offset, hashlib.sha256(data[offset:offset+1024]).hexdigest())
          if any(sections.get(name) != digest for name, digest in expected.items()):
              raise RuntimeError('Bootloader section differs from build 34; investigate before drawing conclusions')
          print('PASS: build 34 executable code and read-only data match the pinned PyInstaller bootloader.')
          print('LIMITATION: matching bootloader sections do not independently validate embedded application code or prove safety.')
          PY
