name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Python 3.14.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'

      - name: Set up Node.js 24 for WebSocket tests
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: pip-audit==2.10.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --only-binary=:all: -r relay/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit installed direct dependencies
        shell: pwsh
        run: |
          python -m pip_audit -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip_audit -r relay/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Python sources and lite feature gates
        shell: pwsh
        run: |
          python -m tools.generate_demo_tracks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q EclipticaMusic.py combat_meter.py vrchat_identity.py boss_weakness.py alert_sound.py tools relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_v18.py --gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_lite.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # tools/test_identity.py must run as a module for imports to resolve.
          python -m tools.test_identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_weakness
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_combat_real
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_watch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_package_release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/test_defender_exclusions.ps1
          python -m tools.test_alert_sound
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_party_relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_party_hud
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_tcl_runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_sample_music
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_api_queue
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_api_gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.test_playback_browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check engine.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check party.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/test_party_client.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows folder with Tcl Tk runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Current Windows Tcl/Tk 9 embeds its libraries in the DLLs via zipfs.
          # Older Python installations expose ordinary Tcl and Tk directories.
          $tclDir = (& python -c "import tkinter as tk; print(tk.Tcl().eval('info library'))").Trim()
          $pyiArgs = @(
            '-m', 'PyInstaller', '--noconfirm', '--clean', '--onedir', '--windowed',
            '--noupx', '--name', 'EclipticaMusicCompanion',
            '--exclude-module', 'yt_dlp', '--exclude-module', 'imageio_ffmpeg',
            '--add-data', 'player.html;.', '--add-data', 'unified.html;.',
            '--add-data', 'engine.js;.',
            '--add-data', 'demo_audio;demo_audio',
            '--add-data', 'party.js;.',
            '--add-data', 'boss_weakness_data.txt;.',
            '--add-data', 'LICENSE_EclipticaHUD-C.txt;.'
          )
          if ($tclDir.StartsWith('//zipfs:/')) {
            # PyInstaller 6.22's tkinter hook collects the Tcl/Tk DLLs; the
            # library scripts live inside those DLLs, not in filesystem paths.
            Write-Host "Tcl/Tk embedded library: $tclDir"
          } else {
            $tkVersion = (& python -c "import tkinter as tk; print(tk.TkVersion)").Trim()
            $tkDir = Join-Path (Split-Path -Parent $tclDir) ("tk" + $tkVersion)
            if (-not (Test-Path (Join-Path $tclDir 'init.tcl'))) { throw "Cannot find Tcl init.tcl in $tclDir" }
            if (-not (Test-Path (Join-Path $tkDir 'tk.tcl'))) { throw "Cannot find Tk tk.tcl in $tkDir" }
            $pyiArgs += @('--add-data', ($tclDir + ';_tcl_data'), '--add-data', ($tkDir + ';_tk_data'))
          }
          $pyiArgs += 'EclipticaMusic.py'
          & python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller exited with $LASTEXITCODE" }

      - name: Validate bundled Tcl Tk and run actual EXE smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'dist/EclipticaMusicCompanion'
          $assets = @(
            '_internal/_tkinter.pyd',
            '_internal/python314.dll'
          )
          foreach ($asset in $assets) {
            $path = Join-Path $root $asset
            if (-not (Test-Path $path)) { throw "Missing Tcl/Tk runtime asset: $path" }
          }
          $tcl9 = (Get-ChildItem (Join-Path $root '_internal') -Filter 'tcl9*.dll' |
            Where-Object { $_.Name -notlike 'tcl9tk*' } | Select-Object -First 1)
          $tk9 = Get-ChildItem (Join-Path $root '_internal') -Filter 'tcl9tk*.dll' | Select-Object -First 1
          if (-not ($tcl9 -and $tk9)) {
            foreach ($asset in @('_internal/_tcl_data/init.tcl', '_internal/_tk_data/tk.tcl',
                                 '_internal/tcl86t.dll', '_internal/tk86t.dll')) {
              if (-not (Test-Path (Join-Path $root $asset))) { throw "Missing Tcl/Tk runtime asset: $asset" }
            }
          }
          # A headless option in EclipticaMusic.py initializes Tcl in the frozen EXE.
          # It does not start the browser, the HUD, or the background server.
          $env:ECLIPTICA_TK_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'ecliptica-tk-test-error.txt'
          $exe = (Resolve-Path (Join-Path $root 'EclipticaMusicCompanion.exe')).Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--tk-self-test' -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            if (Test-Path $env:ECLIPTICA_TK_SELF_TEST_REPORT) { Get-Content $env:ECLIPTICA_TK_SELF_TEST_REPORT }
            throw "Frozen Tcl/Tk startup smoke test failed: exit code $($probe.ExitCode)"
          }
          Write-Host 'PASS: bundled Tcl/Tk libraries and frozen executable startup'

      - name: Open the frozen app and HUD in an isolated GUI smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ecliptica-gui-test'
          $env:ECLIPTICA_GUI_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'ecliptica-gui-test-error.txt'
          $exe = (Resolve-Path 'dist/EclipticaMusicCompanion/EclipticaMusicCompanion.exe').Path
          $probe = Start-Process -FilePath $exe -ArgumentList '--gui-self-test' -PassThru
          if (-not $probe.WaitForExit(30000)) {
            $probe.Kill()
            throw 'Frozen GUI startup test timed out.'
          }
          if ($probe.ExitCode -ne 0) {
            if (Test-Path $env:ECLIPTICA_GUI_SELF_TEST_REPORT) {
              Get-Content $env:ECLIPTICA_GUI_SELF_TEST_REPORT
            }
            throw "Frozen GUI startup test failed: exit code $($probe.ExitCode)"
          }
          Write-Host 'PASS: frozen application and HUD initialized with boss data'

      - name: Verify release contents and write SHA256 manifest
        run: python tools/verify_release.py dist/EclipticaMusicCompanion

      # The hosted runner can exclude whole drives from Defender. Stage a copy
      # and remove only matching exclusions on this temporary hosted runner.
      # The manifest created above is checked against every staged file by the
      # ZIP packager, so a changed file cannot be silently shipped.
      - name: Stage files outside the runner workspace for scanning
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ($env:SystemDrive + '\') ('ecliptica-scan-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          "ECLIPTICA_SCAN_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item -LiteralPath 'dist/EclipticaMusicCompanion' -Destination (Join-Path $root 'app') -Recurse

      - name: Microsoft Defender scan of the application folder
        shell: pwsh
        run: ./tools/windows_defender_scan.ps1 -ReleaseDir (Join-Path $env:ECLIPTICA_SCAN_ROOT 'app')

      - name: Create and verify the exact ZIP in temporary storage
        shell: pwsh
        run: |
          python tools/package_release.py (Join-Path $env:ECLIPTICA_SCAN_ROOT 'app') (Join-Path $env:ECLIPTICA_SCAN_ROOT 'EclipticaMusicCompanion-Windows.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Microsoft Defender scan of the ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path (Join-Path $env:ECLIPTICA_SCAN_ROOT 'EclipticaMusicCompanion-Windows.zip')).Path
          $status = Get-MpComputerStatus -ErrorAction Stop
          $prefs = Get-MpPreference -ErrorAction Stop
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled -or
              -not $status.AntivirusSignatureLastUpdated -or
              $status.AntivirusSignatureLastUpdated -lt (Get-Date).AddDays(-2)) {
            throw 'Defender is unavailable, disabled, or has stale signatures.'
          }
          if ($null -eq $prefs.DisableArchiveScanning -or $prefs.DisableArchiveScanning) {
            Write-Host 'Enabling Defender archive scanning on this temporary runner.'
            Set-MpPreference -DisableArchiveScanning $false -ErrorAction Stop
            $prefs = Get-MpPreference -ErrorAction Stop
          }
          if ($null -eq $prefs.DisableArchiveScanning -or $prefs.DisableArchiveScanning) {
            throw 'Defender archive scanning is disabled or could not be verified.'
          }
          Write-Host 'Defender archive scanning is enabled.'
          . ./tools/check_defender_exclusions.ps1
          Enable-DefenderTargetScanOnHostedRunner -Target $zip
          $before = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $started = Get-Date
          Start-MpScan -ScanType CustomScan -ScanPath $zip -ErrorAction Stop
          if (-not (Test-Path $zip) -or (Get-FileHash -Algorithm SHA256 $zip).Hash -ne $before) {
            throw 'The ZIP was removed or changed during the Defender scan.'
          }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop | Where-Object {
            $_.InitialDetectionTime -ge $started.AddMinutes(-1) -and
            (@($_.Resources) -join ' ') -like "*$zip*"
          })
          if ($detections.Count -gt 0) { throw "Defender reported $($detections.Count) ZIP detection(s)." }
          Write-Host "PASS: Defender ZIP scan, signature $($status.AntivirusSignatureVersion), SHA-256 $before"
          Write-Host 'NOT CLEARED: Chrome warning remains under investigation; no file is uploaded.'

      - name: Verify archive scanning with a harmless control and rescan the ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $platform = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
          $mpcmd = Get-ChildItem -Path $platform -Filter 'MpCmdRun.exe' -File -Recurse |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mpcmd) { throw 'The Defender command-line scanner was not found.' }
          $control = Join-Path $env:RUNNER_TEMP 'ecliptica-harmless-control.zip'
          $zip = (Resolve-Path (Join-Path $env:ECLIPTICA_SCAN_ROOT 'EclipticaMusicCompanion-Windows.zip')).Path
          # A standard, harmless EICAR control verifies that the engine scans
          # inside ZIPs. No control file is uploaded or included in the bundle.
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1],'w',zipfile.ZIP_DEFLATED); z.writestr('control.txt',bytes.fromhex('58354f2150254041505b345c505a58353428505e2937434329377d2445494341522d5354414e444152442d414e544956495255532d544553542d46494c452124482b482a')); z.close()" $control
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the harmless antivirus control.' }
          # DisableRemediation applies only to these explicit scans: it keeps
          # the control available for testing and returns detections as errors.
          # Real-time Defender protection remains active on the runner.
          $controlOutput = & $mpcmd -Scan -ScanType 3 -File $control -DisableRemediation 2>&1
          $controlExit = $LASTEXITCODE
          if ($controlExit -ne 2 -or ($controlOutput | Out-String) -notmatch '(?i)eicar') {
            $controlOutput | Write-Host
            throw "The harmless archive control was not detected as expected (exit $controlExit)."
          }
          Remove-Item -LiteralPath $control -Force
          Write-Host 'PASS: Defender detected the harmless EICAR control inside a ZIP.'
          $before = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $result = & $mpcmd -Scan -ScanType 3 -File $zip -DisableRemediation 2>&1
          $scanExit = $LASTEXITCODE
          $result | Write-Host
          if ($scanExit -ne 0) { throw "Defender command-line ZIP scan failed or found a threat (exit $scanExit)." }
          if (-not (Test-Path -LiteralPath $zip) -or (Get-FileHash -Algorithm SHA256 $zip).Hash -ne $before) {
            throw 'The ZIP was removed or changed during the command-line scan.'
          }
          Write-Host "PASS: command-line archive scan of the exact ZIP, SHA-256 $before"

      - name: Build a standalone Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $singleDir = Join-Path $env:ECLIPTICA_SCAN_ROOT 'standalone'
          $specDir = Join-Path $env:RUNNER_TEMP 'ecliptica-onefile-spec'
          New-Item -ItemType Directory -Path $singleDir, $specDir -Force | Out-Null
          $pyiArgs = @(
            '-m', 'PyInstaller', '--noconfirm', '--clean', '--onefile', '--windowed',
            '--noupx', '--name', 'EclipticaMusicCompanion',
            '--distpath', $singleDir,
            '--workpath', (Join-Path $env:RUNNER_TEMP 'ecliptica-onefile-work'),
            '--specpath', $specDir,
            '--exclude-module', 'yt_dlp', '--exclude-module', 'imageio_ffmpeg'
          )
          foreach ($asset in @('player.html', 'unified.html', 'engine.js', 'party.js',
                               'boss_weakness_data.txt', 'LICENSE_EclipticaHUD-C.txt')) {
            $pyiArgs += @('--add-data', ((Resolve-Path -LiteralPath $asset).Path + ';.'))
          }
          $pyiArgs += @('--add-data', ((Resolve-Path -LiteralPath 'demo_audio').Path + ';demo_audio'))
          $tclDir = (& python -c "import tkinter as tk; print(tk.Tcl().eval('info library'))").Trim()
          if (-not $tclDir.StartsWith('//zipfs:/')) {
            $tkVersion = (& python -c "import tkinter as tk; print(tk.TkVersion)").Trim()
            $tkDir = Join-Path (Split-Path -Parent $tclDir) ('tk' + $tkVersion)
            if (-not (Test-Path (Join-Path $tclDir 'init.tcl'))) { throw 'Tcl init.tcl is missing.' }
            if (-not (Test-Path (Join-Path $tkDir 'tk.tcl'))) { throw 'Tk tk.tcl is missing.' }
            $pyiArgs += @('--add-data', ($tclDir + ';_tcl_data'), '--add-data', ($tkDir + ';_tk_data'))
          }
          $pyiArgs += (Resolve-Path -LiteralPath 'EclipticaMusic.py').Path
          & python @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw "Standalone PyInstaller build failed: $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $singleDir 'EclipticaMusicCompanion.exe'))) {
            throw 'Standalone EXE is missing.'
          }

      - name: Test the standalone EXE and HUD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ecliptica-onefile-gui-test'
          $env:ECLIPTICA_TK_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'onefile-tk-error.txt'
          $env:ECLIPTICA_GUI_SELF_TEST_REPORT = Join-Path $env:RUNNER_TEMP 'onefile-gui-error.txt'
          $exe = (Resolve-Path (Join-Path $env:ECLIPTICA_SCAN_ROOT 'standalone/EclipticaMusicCompanion.exe')).Path
          foreach ($option in @('--tk-self-test', '--gui-self-test')) {
            $probe = Start-Process -FilePath $exe -ArgumentList $option -PassThru
            if (-not $probe.WaitForExit(60000)) { $probe.Kill(); throw "Standalone $option timed out." }
            if ($probe.ExitCode -ne 0) {
              foreach ($report in @($env:ECLIPTICA_TK_SELF_TEST_REPORT, $env:ECLIPTICA_GUI_SELF_TEST_REPORT)) {
                if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
              }
              throw "Standalone $option failed with exit code $($probe.ExitCode)."
            }
          }
          Write-Host 'PASS: standalone EXE, Tcl/Tk and GUI/HUD startup'

      - name: Check YouTube sample playback in Edge
        shell: pwsh
        timeout-minutes: 4
        run: |
          python -m tools.test_youtube_playback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scan the exact standalone EXE with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $folder = Join-Path $env:ECLIPTICA_SCAN_ROOT 'standalone'
          $exe = (Resolve-Path (Join-Path $folder 'EclipticaMusicCompanion.exe')).Path
          $before = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          ./tools/windows_defender_scan.ps1 -ReleaseDir $folder
          . ./tools/check_defender_exclusions.ps1
          Enable-DefenderTargetScanOnHostedRunner -Target $exe
          $platform = Join-Path $env:ProgramData 'Microsoft/Windows Defender/Platform'
          $mpcmd = Get-ChildItem -Path $platform -Filter 'MpCmdRun.exe' -File -Recurse |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $mpcmd) { throw 'The Defender command-line scanner was not found.' }
          $result = & $mpcmd -Scan -ScanType 3 -File $exe -DisableRemediation 2>&1
          $scanExit = $LASTEXITCODE
          $result | Write-Host
          if ($scanExit -ne 0) { throw "Defender EXE scan failed or found a threat (exit $scanExit)." }
          if (-not (Test-Path -LiteralPath $exe) -or (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash -ne $before) {
            throw 'The EXE was removed or changed during its scans.'
          }
          $status = Get-MpComputerStatus -ErrorAction Stop
          Write-Host "PASS: exact standalone EXE scanned, signature $($status.AntivirusSignatureVersion), SHA256 $before"

      - name: Package the exact scanned EXE for encrypted transfer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path (Join-Path $env:ECLIPTICA_SCAN_ROOT 'standalone/EclipticaMusicCompanion.exe')).Path
          $zip = Join-Path $env:ECLIPTICA_SCAN_ROOT 'EclipticaStandalone-transfer.zip'
          python -c "import hashlib,pathlib,sys,zipfile; p=pathlib.Path(sys.argv[1]); z=zipfile.ZipFile(sys.argv[2],'w',zipfile.ZIP_DEFLATED); z.write(p,arcname=p.name); z.close(); z=zipfile.ZipFile(sys.argv[2]); assert z.testzip() is None and z.namelist()==[p.name] and hashlib.sha256(z.read(p.name)).digest()==hashlib.sha256(p.read_bytes()).digest(); z.close(); print('PASS: transfer ZIP contains the exact scanned EXE')" $exe $zip
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the standalone transfer ZIP.' }

      - name: Encrypt the scanned ZIP for a private one-time review
        shell: pwsh
        run: |
          ./tools/private_review_encrypt.ps1 -ZipFile (Join-Path $env:ECLIPTICA_SCAN_ROOT 'EclipticaStandalone-transfer.zip') -PublicKeyFile tools/private_review_public.pem -OutputFile (Join-Path $env:RUNNER_TEMP 'private-preview-encrypted/payload.enc')

      - name: Transfer encrypted review file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encrypted-private-preview-kdwjjay1
          path: ${{ runner.temp }}/private-preview-encrypted/payload.enc
          if-no-files-found: error
          retention-days: 1
      - name: Remove temporary scan files
        if: always()
        shell: pwsh
        run: |
          $prefix = Join-Path ($env:SystemDrive + '\') 'ecliptica-scan-'
          if ($env:ECLIPTICA_SCAN_ROOT) {
            if (-not $env:ECLIPTICA_SCAN_ROOT.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing to remove an unexpected scan directory.'
            }
            if (Test-Path -LiteralPath $env:ECLIPTICA_SCAN_ROOT) {
              Remove-Item -LiteralPath $env:ECLIPTICA_SCAN_ROOT -Recurse -Force
            }
          }

      # This repository is public. Keep all binaries on the temporary runner
      # until the Chrome warning and the distribution checks are resolved.

