name: Test local EXE builder without publishing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.10'
      - name: Test the local builder without uploading any binaries
        env:
          ECLIPTICA_BUILDER_CI: '1'
        shell: pwsh
        run: |
          python build_personal_exe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
