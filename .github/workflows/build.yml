
name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application folder
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name EclipticaMusicCompanion --add-data "player.html;." EclipticaMusic.py

      - name: Upload application folder
        uses: actions/upload-artifact@v4
        with:
          name: EclipticaMusicCompanion-Windows-v0.5
          path: dist/EclipticaMusicCompanion/
          if-no-files-found: error
