name: Notify Discord of releases
on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or parsed.hostname not in ("discord.com", "discordapp.com") or not parsed.path.startswith("/api/webhooks/"):
              raise SystemExit("DISCORD_WEBHOOK_URL is missing or invalid")
          with open(os.environ["EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)
          release = event["release"]
          title = release.get("name") or release["tag_name"]
          link = release["html_url"]
          message = {"content": f"📢 Ecliptica Music Companion のリリース\n{title}\n{link}", "allowed_mentions": {"parse": []}}
          request = urllib.request.Request(url, json.dumps(message, ensure_ascii=False).encode("utf-8"), {"Content-Type": "application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError("Discord notification failed")
          except Exception:
              raise SystemExit("Discord notification failed. Check webhook settings.")
          PY
