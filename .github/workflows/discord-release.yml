name: Notify Discord of releases
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_url:
        description: GitHub release URL
        required: true
        type: string
      release_title:
        description: Release title
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release announcement
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          url = os.environ.get("DISCORD_WEBHOOK_URL", "")
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or parsed.hostname not in ("discord.com", "discordapp.com") or not parsed.path.startswith("/api/webhooks/"):
              raise SystemExit("DISCORD_WEBHOOK_URL is missing or invalid")
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)
          if "release" in event:
              release = event["release"]
              title = release.get("name") or release["tag_name"]
              link = release["html_url"]
          else:
              title = event["inputs"]["release_title"]
              link = event["inputs"]["release_url"]
          if not link.startswith("https://github.com/jetstream3150-dev/EclipticaMusicCompanion/releases/tag/"):
              raise SystemExit("Invalid release URL")
          message = {"content": f"📢 Ecliptica Music Companion のリリース\n{title}\n{link}", "allowed_mentions": {"parse": []}}
          request = urllib.request.Request(url, json.dumps(message, ensure_ascii=False).encode("utf-8"), {"Content-Type": "application/json", "User-Agent": "DiscordBot (https://github.com/jetstream3150-dev/EclipticaMusicCompanion, 1.0)"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError("Discord notification failed")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Discord webhook returned HTTP {error.code}; check webhook settings.")
          except urllib.error.URLError:
              raise SystemExit("Discord webhook connection failed; check network availability.")
          except Exception:
              raise SystemExit("Discord notification failed; check webhook settings.")
          PY
